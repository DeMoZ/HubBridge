name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-macos.sh
      - scripts/version.sh
      - android/app/build.gradle.kts
      - docs/releases/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main, nothing is released"; exit 1; }
      - name: Check the version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(scripts/version.sh)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml ($version)"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          cargo install cargo-ndk --locked
      - name: Prepare the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "::error::${missing[*]} not set, a release must be signed with the release key"
              exit 1
            fi
            echo "::warning::${missing[*]} not set, this dry run signs the APK with the debug key"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "HUBBRIDGE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          HUBBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUBBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUBBRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify the APK signature
        env:
          RELEASE_CERT_SHA256: ada28626046f1affa03305c1a5e734151c5191f63e216f84a62aa77cbc29e535
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            signer=$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: *//p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
            expected=$(echo "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            [[ "$signer" == "$expected" ]] || { echo "::error::The APK is not signed with the pinned release certificate (expected $expected, got ${signer:-none})"; exit 1; }
          fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/HubBridge-$(scripts/version.sh).apk"
      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/HubBridge-*.apk
          if-no-files-found: error

  macos:
    name: macOS app and CLI
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(scripts/version.sh)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml ($version)"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist
      - name: Build .app, .dmg, update zip and CLI archive (Apple Silicon)
        run: scripts/build-macos.sh --apk "dist/HubBridge-$(scripts/version.sh).apk"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/HubBridge-macOS.dmg
            dist/HubBridge-*-macos-arm64.zip
            dist/hubbridge-*-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          version=$(scripts/version.sh)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml ($version)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/version.sh)
          notes=docs/releases/$GITHUB_REF_NAME.md
          if [[ -f "$notes" ]]; then args=(--notes-file "../$notes"); else args=(--generate-notes); fi
          cd dist
          mv HubBridge-macOS.dmg "HubBridge-macOS-$GITHUB_REF_NAME.dmg"
          files=(
            "HubBridge-macOS-$GITHUB_REF_NAME.dmg"
            "HubBridge-$version-macos-arm64.zip"
            "HubBridge-$version.apk"
            "hubbridge-$version-macos-arm64.tar.gz"
          )
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "HubBridge $GITHUB_REF_NAME" "${args[@]}" \
            "${files[@]}"
