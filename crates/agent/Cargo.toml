[package]
name = "hubbridge-agent"
description = "HubBridge agent core: TCP server, pairing, sessions, device registry (runs on Android via JNI and in the desktop simulator)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
hubbridge-proto = { workspace = true }
hubbridge-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
# `tokio`: nusb runs its blocking syscalls (open, claim) on tokio's blocking pool; without a
# runtime feature awaiting them panics.
nusb = { version = "0.2", features = ["tokio"] }
