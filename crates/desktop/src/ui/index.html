<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>HubBridge</title>
<style>
/* Ambient Glass. Tokens: dark is the base; the light set is written twice (system appearance
   and the data-theme hook for checks); the unit test in main.rs keeps the copies identical. */
:root {
  --bg-0: #0B0C12;
  --bg-1: #12141C;
  --surface-1: rgba(255,255,255,0.06);
  --surface-2: rgba(255,255,255,0.09);
  --surface-3: rgba(255,255,255,0.13);
  --surface-sheet: rgba(24,26,36,0.86);
  --edge: rgba(255,255,255,0.09);
  --edge-strong: rgba(255,255,255,0.18);
  --spec: rgba(255,255,255,0.10);
  --text-1: #F3F5FB;
  --text-2: #CBD0E0;
  --text-3: #A8AEC4;
  --accent: #AFB4FF;
  --on-accent: #0B0C12;
  --mint: #5FE9C6;
  --ok: #4ADE8F;
  --warn: #FFC266;
  --err: #FF9AA4;
  --support: #FF7DBA;
  --scrim: rgba(4,5,10,0.55);
  --glow-a: rgba(95,233,198,0.08);
  --glow-b: rgba(146,152,255,0.10);
  --elev-1: 0 1px 2px rgba(0,0,0,.30), 0 14px 32px -20px rgba(0,0,0,.55);
  --elev-2: 0 8px 24px -12px rgba(0,0,0,.6);
  --elev-3: 0 40px 120px -30px rgba(0,0,0,.75);
  --elev-4: var(--elev-3);
  --border-w: 1px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg-0: #F3F4F8;
    --bg-1: #FFFFFF;
    --surface-1: rgba(255,255,255,0.72);
    --surface-2: #FFFFFF;
    --surface-3: #ECEEF4;
    --surface-sheet: rgba(255,255,255,0.90);
    --edge: rgba(16,18,32,0.08);
    --edge-strong: rgba(16,18,32,0.16);
    --spec: rgba(255,255,255,0.90);
    --text-1: #11131B;
    --text-2: #41475C;
    --text-3: #5A6179;
    --accent: #4A50DB;
    --on-accent: #FFFFFF;
    --mint: #067A62;
    --ok: #09703F;
    --warn: #8F5400;
    --err: #C02B3C;
    --support: #B92A68;
    --scrim: rgba(20,22,40,0.28);
    --glow-a: rgba(95,233,198,0.10);
    --glow-b: rgba(146,152,255,0.10);
    --elev-1: 0 1px 2px rgba(20,24,40,.06), 0 14px 32px -22px rgba(20,24,40,.20);
    --elev-2: 0 8px 24px -14px rgba(20,24,40,.22);
    --elev-3: 0 40px 100px -30px rgba(20,24,40,.30);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg-0: #F3F4F8;
  --bg-1: #FFFFFF;
  --surface-1: rgba(255,255,255,0.72);
  --surface-2: #FFFFFF;
  --surface-3: #ECEEF4;
  --surface-sheet: rgba(255,255,255,0.90);
  --edge: rgba(16,18,32,0.08);
  --edge-strong: rgba(16,18,32,0.16);
  --spec: rgba(255,255,255,0.90);
  --text-1: #11131B;
  --text-2: #41475C;
  --text-3: #5A6179;
  --accent: #4A50DB;
  --on-accent: #FFFFFF;
  --mint: #067A62;
  --ok: #09703F;
  --warn: #8F5400;
  --err: #C02B3C;
  --support: #B92A68;
  --scrim: rgba(20,22,40,0.28);
  --glow-a: rgba(95,233,198,0.10);
  --glow-b: rgba(146,152,255,0.10);
  --elev-1: 0 1px 2px rgba(20,24,40,.06), 0 14px 32px -22px rgba(20,24,40,.20);
  --elev-2: 0 8px 24px -14px rgba(20,24,40,.22);
  --elev-3: 0 40px 100px -30px rgba(20,24,40,.30);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg-0: #0B0C12;
  --bg-1: #12141C;
  --surface-1: rgba(255,255,255,0.06);
  --surface-2: rgba(255,255,255,0.09);
  --surface-3: rgba(255,255,255,0.13);
  --surface-sheet: rgba(24,26,36,0.86);
  --edge: rgba(255,255,255,0.09);
  --edge-strong: rgba(255,255,255,0.18);
  --spec: rgba(255,255,255,0.10);
  --text-1: #F3F5FB;
  --text-2: #CBD0E0;
  --text-3: #A8AEC4;
  --accent: #AFB4FF;
  --on-accent: #0B0C12;
  --mint: #5FE9C6;
  --ok: #4ADE8F;
  --warn: #FFC266;
  --err: #FF9AA4;
  --support: #FF7DBA;
  --scrim: rgba(4,5,10,0.55);
  --glow-a: rgba(95,233,198,0.08);
  --glow-b: rgba(146,152,255,0.10);
  --elev-1: 0 1px 2px rgba(0,0,0,.30), 0 14px 32px -20px rgba(0,0,0,.55);
  --elev-2: 0 8px 24px -12px rgba(0,0,0,.6);
  --elev-3: 0 40px 120px -30px rgba(0,0,0,.75);
  color-scheme: dark;
}
/* Type, spacing, radii, motion: the same in both themes. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --fs-xs: 11.5px; --fs-s: 12.5px; --fs-m: 14px; --fs-l: 16px; --fs-xl: 20px; --fs-2xl: 28px; --fs-3xl: 44px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 32px;
  --r-panel: 24px; --r-card: 16px; --r-control: 12px; --r-pill: 999px; --r-sheet: 28px;
  --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-emph: cubic-bezier(.3,1.25,.5,1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-0);
  color: var(--text-1);
  font: 400 var(--fs-m)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: var(--fs-s); }
.num { font-variant-numeric: tabular-nums; }
.sel { user-select: text; -webkit-user-select: text; }

/* ambient light: two soft glows, no blur filter */
body::before {
  content: ""; position: fixed; inset: -6vmax; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60vmax 60vmax at 20% 0%, var(--glow-a), transparent 70%),
    radial-gradient(60vmax 60vmax at 85% 100%, var(--glow-b), transparent 70%);
  animation: ambient 60s ease-in-out infinite alternate;
}
@keyframes ambient { to { transform: translate3d(3vmax, -2vmax, 0); } }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-5); }
.platform-macos .top { padding-left: 86px; }
.logo { color: var(--on-accent); width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--mint), var(--accent)); display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px -8px var(--accent); }
.logo svg { width: 22px; height: 22px; }
.brand { font: 650 var(--fs-l)/1 var(--font-display); letter-spacing: -.01em; }
.top-mid { flex: 1; display: flex; justify-content: center; min-width: 0; }
.top-actions { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: var(--sp-2); height: 30px; padding: 0 var(--sp-3); border-radius: var(--r-pill); background: var(--surface-1); border: var(--border-w) solid var(--edge); box-shadow: inset 0 1px 0 var(--spec); font-size: var(--fs-s); color: var(--text-2); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); white-space: nowrap; }
button.pill { cursor: pointer; transition: background var(--dur-1), color var(--dur-1); }
button.pill:hover { background: var(--surface-2); color: var(--text-1); }
.pill svg { width: 14px; height: 14px; flex: none; }
#updBtn .dot { display: none; }
.pill.has-update, button.pill.has-update:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
#updBtn.has-update .dot { display: inline-block; background: var(--accent); }
button.pill.support:hover { color: var(--support); border-color: color-mix(in srgb, var(--support) 55%, transparent); }
.island { max-width: 100%; min-width: 0; overflow: hidden; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.island #stText { display: inline-flex; min-width: 0; overflow: hidden; white-space: nowrap; }
.island .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.island .ex { flex: none; padding-left: .4em; }
#stMark { display: inline-flex; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; display: inline-block; }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent); }
.dot.wait { background: var(--warn); animation: breathe 1.6s ease-in-out infinite; }
.dot.err { background: var(--err); border-radius: 2px; transform: rotate(45deg); }
@keyframes breathe { 50% { opacity: .35; } }

.main { display: grid; grid-template-columns: minmax(320px, 360px) 1fr; gap: var(--sp-4); padding: var(--sp-2) var(--sp-5) var(--sp-5); min-height: 0; }
/* inline padding + matching negative margin: the panel shadow reaches into the padding instead of being clipped; the facing sides take half the gap so the columns do not overlap */
.col { min-height: 0; min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--sp-4); padding: 0 14px var(--sp-5); margin: 0 -14px; }
.panel:focus-visible { outline-offset: -2px; }
.col:first-child { padding-right: calc(var(--sp-4) / 2); margin-right: calc(var(--sp-4) / -2); }
.col:last-child { padding-left: calc(var(--sp-4) / 2); margin-left: calc(var(--sp-4) / -2); }
.col::-webkit-scrollbar { width: 8px; } .col::-webkit-scrollbar-thumb { background: var(--edge-strong); border-radius: 8px; }

.panel { background: var(--surface-1); border: var(--border-w) solid var(--edge); border-radius: var(--r-panel); padding: var(--sp-5); box-shadow: inset 0 1px 0 var(--spec), var(--elev-1); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); }
.ph { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.ph h2 { margin: 0; font-size: var(--fs-m); font-weight: 600; color: var(--text-2); }
.ph .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--surface-3); color: var(--text-2); font-size: var(--fs-xs); font-weight: 500; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.ph .count:empty { display: none; }

.card { position: relative; overflow: hidden; background: var(--surface-2); border: var(--border-w) solid var(--edge); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: var(--sp-2); transition: border-color var(--dur-1), box-shadow var(--dur-2); }
.card + .card { margin-top: var(--sp-2); }
.card:hover { border-color: var(--edge-strong); }
.card.active { border: 1.5px solid var(--accent); box-shadow: var(--elev-2); padding: 13.5px; }
.card.active::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.name { font-size: var(--fs-l); font-weight: 600; line-height: 1.35; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--text-3); font-size: var(--fs-s); line-height: 1.4; }
.sub.warnline { color: var(--warn); }
.muted { color: var(--text-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 500; border: var(--border-w) solid var(--edge-strong); color: var(--text-2); white-space: nowrap; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.chip.err { color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); border-color: color-mix(in srgb, var(--err) 32%, transparent); }
.chip.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }

.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border: var(--border-w) solid var(--edge-strong); background: var(--surface-3); border-radius: var(--r-control); cursor: pointer; font-size: var(--fs-m); font-weight: 550; white-space: nowrap; transition: transform var(--dur-1) var(--ease), background var(--dur-1), filter var(--dur-1); }
.btn:hover { background: color-mix(in srgb, var(--surface-3) 80%, var(--accent) 10%); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; pointer-events: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--err); background: transparent; }
.btn.danger:hover { background: color-mix(in srgb, var(--err) 8%, transparent); }
.btn.small { height: 28px; padding: 0 10px; border-radius: 10px; font-size: var(--fs-s); }
.btn .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; margin-right: 6px; }
@keyframes rot { to { transform: rotate(360deg); } }

input.field { width: 100%; height: 34px; background: var(--surface-3); border: var(--border-w) solid var(--edge-strong); border-radius: var(--r-control); padding: 0 var(--sp-3); outline: none; user-select: text; -webkit-user-select: text; transition: border-color var(--dur-1), box-shadow var(--dur-1); }
input.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent); }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.inline { display: flex; gap: var(--sp-2); }
.inline .field { flex: 1; min-width: 0; }
details summary { cursor: pointer; color: var(--text-2); font-size: var(--fs-s); list-style: none; display: flex; align-items: center; gap: 6px; border-radius: 6px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: ""; width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(-45deg); transition: transform var(--dur-2) var(--ease); margin: 0 3px 0 1px; flex: none; }
details[open] summary::before { transform: rotate(45deg); }
.form { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: 10px; }
.note { font-size: var(--fs-s); color: var(--text-2); background: var(--surface-2); border: var(--border-w) dashed var(--edge-strong); border-radius: var(--r-card); padding: 10px var(--sp-3); }
.note b { color: var(--text-1); }
.note code, .sub code { font-family: var(--font-mono); font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 5px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input.field:focus-visible { outline: none; }
input.field::placeholder { color: var(--text-2); opacity: 1; }
:focus:not(:focus-visible) { outline: none; }

/* connection hero */
.hero { display: grid; grid-template-columns: 1fr minmax(280px, auto); gap: var(--sp-6); align-items: center; }
.hero h1 { margin: 0 0 4px; font: 700 var(--fs-2xl)/1.15 var(--font-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.hero .facts { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-3); }
.rtt { min-width: 280px; }
@media (max-width: 1000px) { .hero { grid-template-columns: 1fr; gap: var(--sp-4); } .rtt { min-width: 0; } }
.rtt .big { font: 700 var(--fs-3xl)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.rtt .big small { font-size: var(--fs-l); font-weight: 600; letter-spacing: 0; color: var(--text-2); }
.rtt svg { width: 280px; height: 64px; display: block; margin: var(--sp-2) 0 4px; }
.rtt .stats { font-size: var(--fs-s); color: var(--text-3); }
.empty { text-align: center; padding: var(--sp-6) 10px; color: var(--text-2); }
.empty h1 { font: 650 var(--fs-xl)/1.25 var(--font-display); margin: 6px 0 8px; color: var(--text-1); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-top: var(--sp-5); text-align: left; }
.step { position: relative; background: var(--surface-2); border: var(--border-w) solid var(--edge); border-radius: var(--r-card); padding: 14px; font-size: var(--fs-s); }
.step + .step::before { content: ""; position: absolute; left: -13px; top: 27px; width: 14px; height: 2px; background: var(--accent); opacity: .6; }
.step b { display: block; font-size: var(--fs-m); margin-bottom: 4px; color: var(--text-1); }
.step i { font-style: normal; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; font-size: var(--fs-s); margin-bottom: var(--sp-2); font-variant-numeric: tabular-nums; }
.err-line { color: var(--err); font-size: var(--fs-s); margin-top: var(--sp-2); }

/* devices */
.devgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-3); }
.dev { background: var(--surface-2); border: var(--border-w) solid var(--edge); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.dev:hover { border-color: var(--edge-strong); }
.dev.dim .ico { opacity: .62; }
.dev.dim .title { color: var(--text-2); }
.dev .head { display: flex; gap: 10px; align-items: flex-start; }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-3); flex: none; color: var(--accent); }
.ico svg { width: 18px; height: 18px; }
.dev .title { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.tree { font-size: var(--fs-s); color: var(--text-2); border-left: 1px solid var(--edge-strong); margin-left: 4px; padding: 2px 0 2px var(--sp-3); display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere; }
.tree .l2 { padding-left: 12px; } .tree .l3 { padding-left: 24px; color: var(--text-3); }

/* serial bridge row of a device card */
.serial { border-top: var(--border-w) solid var(--edge); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-s); }
.serial .sform { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.serial label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.serial input.field { height: 28px; padding: 0 8px; border-radius: 10px; }
.serial .counters { color: var(--text-2); }

.toasts { position: fixed; right: var(--sp-5); bottom: var(--sp-5); z-index: 20; display: flex; flex-direction: column; gap: var(--sp-2); max-width: 420px; }
.toast { display: flex; align-items: flex-start; gap: 10px; background: var(--surface-sheet); border: var(--border-w) solid var(--edge-strong); border-radius: var(--r-card); padding: 10px 14px; box-shadow: inset 0 1px 0 var(--spec), var(--elev-4); font-size: var(--fs-s); animation: toast-in var(--dur-2) var(--ease); backdrop-filter: blur(32px) saturate(150%); -webkit-backdrop-filter: blur(32px) saturate(150%); user-select: text; -webkit-user-select: text; white-space: pre-wrap; }
.toast .td { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-top: 7px; flex: none; }
.toast.err .td { background: var(--err); border-radius: 1px; transform: rotate(45deg); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

.modal { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: var(--scrim); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.modal.open { display: grid; animation: fade-in var(--dur-2) var(--ease); }
.sheet { width: 420px; max-width: calc(100vw - 32px); background: var(--surface-sheet); border: var(--border-w) solid var(--edge-strong); border-radius: var(--r-sheet); padding: var(--sp-6); box-shadow: inset 0 1px 0 var(--spec), var(--elev-3); backdrop-filter: blur(32px) saturate(150%); -webkit-backdrop-filter: blur(32px) saturate(150%); }

@keyframes sheet-in { from { opacity: 0; transform: translateY(8px) scale(.96); } }
.sheet .sh { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-2); }
.sheet h3 { margin: 0; flex: 1; font: 600 var(--fs-l)/1.35 var(--font-display); }
.sheet .x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--text-2); cursor: pointer; font-size: 15px; line-height: 1; transition: background var(--dur-1), color var(--dur-1); }
.sheet .x:hover { background: var(--surface-3); color: var(--text-1); }
.pin { margin-top: var(--sp-4); height: 64px; font: 600 32px/1 var(--font-mono); letter-spacing: 14px; text-align: center; padding: 0 0 0 14px; }
.sheet .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-5); }

/* update and support sheets */
[hidden] { display: none !important; }
.sheet { max-height: calc(100vh - 32px); overflow-y: auto; }
.sheet.wide { width: 480px; }
.sheet .ico.support { color: var(--support); }
.notes { margin-top: var(--sp-3); max-height: 240px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px var(--sp-3); border-radius: var(--r-card); background: var(--surface-2); border: var(--border-w) solid var(--edge); color: var(--text-2); font-size: var(--fs-s); }
.sheet .warnline { margin-top: var(--sp-3); }
.status-line { display: flex; align-items: center; gap: var(--sp-2); min-height: 18px; margin-top: var(--sp-3); font-size: var(--fs-s); color: var(--text-2); overflow-wrap: anywhere; }
.status-line > span:last-child { min-width: 0; }
.status-line.ok { color: var(--ok); }
.status-line.err { color: var(--err); }
.status-line.new { color: var(--accent); }
.spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--edge-strong); border-top-color: var(--accent); animation: rot .9s linear infinite; flex: none; display: inline-block; }
.sheet h3 .spinner { margin-left: var(--sp-2); vertical-align: -1px; }
.tick { display: flex; gap: var(--sp-2); align-items: flex-start; margin: var(--sp-3) 0 var(--sp-2); cursor: pointer; color: var(--text-2); font-size: var(--fs-s); }
.tick input { flex: none; margin-top: 1px; }
.methods { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-4); }
.method { display: grid; grid-template-columns: 34px 1fr auto; gap: var(--sp-3); align-items: center; text-align: left; padding: 10px var(--sp-3); border-radius: var(--r-card); background: var(--surface-2); border: var(--border-w) solid var(--edge); cursor: pointer; color: var(--text-1); transition: border-color var(--dur-1); }
.method:hover { border-color: var(--edge-strong); }
.method .emoji { font-size: var(--fs-xl); text-align: center; }
.method b { display: block; font-weight: 600; }
.method .desc { display: block; margin-top: 2px; color: var(--text-2); font-size: var(--fs-s); line-height: 1.4; }
.method .arrow { color: var(--text-2); }

/* preference overrides */
@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }

  .btn .spin, .spinner { animation: none; }

  details summary::before { transition: none; }
}
@media (prefers-contrast: more), (prefers-reduced-transparency: reduce) {

// A selector that finds `el` again after a re-render: its id, or its data-* attributes.
const FOCUS_KEYS = ["act", "kind", "value", "id", "serial", "key", "text"];
function focusSel(el) {
  if (el.id) return "#" + el.id;
  const d = Object.entries(el.dataset || {}).filter(([k]) => FOCUS_KEYS.includes(k));
  if (!d.length) return null;
  return el.tagName.toLowerCase() + d.map(([k, v]) => `[data-${k}="${String(v).replace(/["\\]/g, "\\$&")}"]`).join("");
}
const headingOf = (box) => box.querySelector(box.classList.contains("sheet") ? "h3" : "h2") || box;
// Re-rendering replaces the markup; keep the keyboard focus on the same control (or the panel or sheet heading).
function put(id, html) {
  if (rendered[id] === html) return;
  rendered[id] = html;
  const host = $(id), ae = document.activeElement;
  const sel = ae && ae !== host && host.contains(ae) ? focusSel(ae) : null;
  host.innerHTML = html;
  if (sel) {
    let n = null;
    try { n = host.querySelector(sel); } catch (e) {}
    if (n && !n.disabled) { n.focus(); if (document.activeElement === n) return; }
    headingOf(host.closest(".panel, .sheet") || host).focus();

}

const ICONS = {

function devKind(d) {
  const classes = [d.class, ...d.configurations.flatMap((c) => c.interfaces.map((i) => i.class))];
  if (classes.includes(8)) return "storage";
  if (classes.includes(3)) return "hid";
  if (classes.includes(14)) return "video";
  if (classes.includes(1)) return "audio";
  if (classes.includes(9)) return "hub";
  if (classes.includes(17)) return "info";

function renderStatus() {
  const c = M.conn;
  // `label` is plain text (tooltip, live region); the visible text is its escaped copy plus the round trip.
  const nm = (x) => `<span class="nm">${esc(x)}</span>`;
  let cls = "idle", label = t("idle"), html = nm(label);
  if (c.state === "connected") {
    cls = "ok";

    label = `${c.name} · ${t("via_" + c.via)}`;
    // The name is the part that gets an ellipsis; link type and round trip never shrink.
    html = nm(c.name) + `<span class="ex">· ${esc(t("via_" + c.via))}${last == null ? "" : ` · <span class="num">${last.toFixed(1)} ${t("ms")}</span>`}</span>`;

function spark(rtt) {
  if (rtt.length < 2) return `<svg viewBox="0 0 280 64" aria-hidden="true"></svg>`;
  const W = 280, H = 64, max = Math.max(...rtt) * 1.15, min = 0;
  const pts = rtt.map((v, i) => `${((i / (rtt.length - 1)) * W).toFixed(1)},${(H - 3 - ((v - min) / (max - min || 1)) * (H - 8)).toFixed(1)}`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs>
    <linearGradient id="spark-g" x1="0" x2="1"><stop offset="0" style="stop-color:var(--mint)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
    <linearGradient id="spark-gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="spark-gm" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="url(#spark-gf)"/></mask></defs>
    <polygon points="${pts.join(" ")} ${W},${H} 0,${H}" fill="url(#spark-g)" mask="url(#spark-gm)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="url(#spark-g)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function serialRow(d) {

function renderDevices() {
  // Do not replace the cards while the user types in a serial field (it would lose focus):
  // the counters of running bridges are updated in place, the rest waits for the field to blur.
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches("input") && $("devices").contains(ae)) {
    for (const v of M.serial || []) {
      const el = document.querySelector(`[data-ctr="${v.id}"]`);
      if (el && v.running) el.textContent = counterText(v);
    }
    return;
  }
  const list = M.devices;
  $("devCount").textContent = list.length ? String(list.length) : "";
  if (M.conn.state !== "connected") {
    // A bridge that ended with the connection keeps its reason on screen.
    const gone = (M.serial || []).filter((v) => !v.running && v.error);
    return put("devices", `<div class="note">${t("notConnected")}</div>` +
      gone.map((v) => `<div class="err-line sel">${t("serialT")} ${esc(v.driver)} [${v.id}]: ${esc(t("stoppedWhy", { r: v.error }))}</div>`).join(""));
  }
  if (!list.length) return put("devices", `<div class="note">${t("noDevices")}</div>`);
  // Real devices first, the hub's own Billboard descriptors last.
  const sorted = [...list].sort((a, b) => (devKind(a) === "info") - (devKind(b) === "info") || a.id - b.id);
  put("devices", `<div class="devgrid">${sorted.map((d) => {
    const kind = devKind(d);
    const billboard = kind === "info";
    const intfClasses = [...new Set(d.configurations.flatMap((c) => c.interfaces.map((i) => className(i.class))))];
    const chips = [
      `<span class="chip mono sel">${hex4(d.vendor_id)}:${hex4(d.product_id)}</span>`,
      ...intfClasses.map((n) => `<span class="chip">${esc(n)}</span>`),
      d.bcd_usb ? `<span class="chip">USB ${(d.bcd_usb >> 8)}.${(d.bcd_usb & 0xff).toString(16).padStart(2, "0")}</span>` : "",
      billboard ? `<span class="chip">${t("hubInfo")}</span>` : `<span class="chip ${d.has_permission ? "ok" : "warn"}">${t(d.has_permission ? "granted" : "noPerm")}</span>`,
    ].join("");
    const open = expanded.has(d.id);
    const tree = open ? `<div class="tree mono sel">${d.configurations.map((c) =>
      `<div>${t("cfg")} ${c.value}${c.name ? ` "${esc(c.name)}"` : ""} · ${c.max_power_ma} mA · 0x${c.attributes.toString(16)}</div>` +
      c.interfaces.map((i) => `<div class="l2">${t("intf")} ${i.number}.${i.alternate} ${esc(className(i.class))} ${i.class.toString(16)}/${i.subclass.toString(16)}/${i.protocol.toString(16)}${i.name ? ` "${esc(i.name)}"` : ""}</div>` +
        i.endpoints.map((e) => `<div class="l3">${t("ep")} 0x${e.address.toString(16).padStart(2, "0")} ${e.address & 0x80 ? "IN " : "OUT"} ${["control", "iso", "bulk", "interrupt"][e.attributes & 3]} ${e.max_packet_size} B${(e.attributes & 3) === 3 ? " /" + e.interval : ""}</div>`).join("")).join("")).join("")}
      <div class="l3">${esc(d.path)}${d.serial ? " · S/N " + esc(d.serial) : ""}</div></div>` : "";
    return `<div class="dev ${billboard ? "dim" : ""}"><div class="head">${icon(kind)}<div style="min-width:0">
        <div class="title sel" title="${esc(d.product ?? "")}">${esc(d.product ?? "USB device")}</div><div class="sub sel">${esc(d.manufacturer ?? "")}</div></div></div>
      <div class="row">${chips}</div>
      <div class="row">${!d.has_permission && !billboard ? btn(t("ask"), data({ act: "grant", id: d.id }), "small primary") : ""}${btn(t("details"), data({ act: "toggle", id: d.id }), "small ghost")}</div>${serialRow(d)}${tree}</div>`;
  }).join("")}</div>`);

  $("updStatus").className = "status-line sel " + (u.checking ? "" : u.downloading ? "new" : u.status ? u.status.kind : "");
  put("updStatus", (busy ? '<span class="spinner" aria-hidden="true"></span>' : "") + `<span>${esc(u.checking ? t("checking") : text)}</span>`);
  let actions;
  if (a && u.no_file) actions = sheetBtn(t("btnPage"), "updpage", "primary");
  else if (a) {
    actions = sheetBtn(t("btnSkip"), "updskip", "ghost", busy) + sheetBtn(t("btnLater"), "updlater", "ghost", u.downloading) +
      (installable ? sheetBtn(t("btnInstall"), "updinstall", "primary", busy) : sheetBtn(t("btnPage"), "updpage", "primary"));
  } else actions = sheetBtn(t("btnAll"), "updpage", "ghost") + sheetBtn(t("btnUpdCheck"), "updcheck", "primary", busy || !u.can_update);
  put("updActions", actions);
}

const METHOD_ICON = { cloudtips: "💳", tribute: "🌍" };
function renderDonate() {
  const d = M.donate, info = d.info || { message: null, methods: [] };
  setHidden("donateSpin", !d.loading);
  setText("donateMessage", info.message || "");
  setHidden("donateOffline", !d.offline);
  put("donateMethods", info.methods.map((m) => `<button type="button" class="method" data-act="openurl" data-value="${esc(m.url)}" title="${esc(m.url)}">
    <span class="emoji" aria-hidden="true">${Object.hasOwn(METHOD_ICON, m.id) ? METHOD_ICON[m.id] : "🤝"}</span>
    <span><b>${esc(m.title)}</b>${m.description ? `<span class="desc">${esc(m.description)}</span>` : ""}</span>
    <span class="arrow" aria-hidden="true">↗</span></button>`).join(""));
}

function render() {
  if (!M) return;
  renderStatus(); renderAgents(); renderPhones(); renderConn(); renderDevices(); renderUpdate(); renderDonate();
}

// `update.offer` grows when a check wants the update sheet open; the failed-update toast shows once.
let lastOffer = 0;
let failedShown = false;
function offerUpdate() {
  if ($("updateModal").classList.contains("open")) return;
  // Not over another sheet (the PIN field, Support): the update sheet opens when that one is closed.
  const other = ["pairModal", "donateModal"].map($).find((m) => m.classList.contains("open"));
  if (other) {
    other.addEventListener("sheetclose", () => setTimeout(offerUpdate, 0), { once: true });
    return;
  }
  openSheet("updateModal", "updBtn");
}

window.onState = (m) => {
  M = m;
  M.busy = m.busy || [];
  render();
  if (M.update.failed_launch && !failedShown) { failedShown = true; window.onToast("err", t("updateFailedToast")); }
  if (M.update.offer > lastOffer) { lastOffer = M.update.offer; offerUpdate(); }
};
window.onToast = (kind, text) => {
  const el = document.createElement("div");
  el.className = "toast " + (kind === "err" ? "err" : "");
  const dot = document.createElement("span"); dot.className = "td";
  const msg = document.createElement("span"); msg.textContent = text;
  el.append(dot, msg);
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 12000 : 6000);
  el.onclick = () => el.remove();
};

// Sheets: shared by the pairing sheet and the sheets of later changes.
const focusables = (m) => [...m.querySelectorAll("button, input, [tabindex]")].filter((e) => !e.disabled && e.tabIndex >= 0 && !e.closest("[hidden]"));
// While a sheet is open the rest of the page is inert: no focus, no clicks, hidden from assistive tech.
const setInert = (on) => { for (const el of document.querySelectorAll(".app, .toasts")) el.inert = on; };
// `fallback`: the id that gets the focus back when nothing was focused (the sheet opened by itself, or WebKit did
// not focus the clicked button).
function openSheet(id, fallback) {
  const m = $(id);
  let o = document.activeElement;
  if ((!o || o === document.body) && fallback) o = $(fallback);
  m._opener = o && o !== document.body ? { el: o, sel: focusSel(o), panel: o.closest(".panel, .sheet") } : null;
  m.classList.add("open");
  setInert(true);
  setTimeout(() => { const f = m.querySelector("[data-first]") || m.querySelector("input") || m.querySelector("button"); if (f) f.focus(); }, 30);
}
function closeSheet(id) {
  const m = $(id);
  if (!m.classList.contains("open")) return;
  m.classList.remove("open");
  if (!document.querySelector(".modal.open")) setInert(false);
  m.dispatchEvent(new Event("sheetclose"));
  const o = m._opener; m._opener = null;
  if (!o) return;
  // The opener may have been re-rendered meanwhile: find its twin, else the panel heading.
  let n = o.el.isConnected ? o.el : null;
  if (!n && o.sel) { try { n = document.querySelector(o.sel); } catch (e) {} }
  if (!n && o.panel) n = headingOf(o.panel);
  if (n && n.focus) n.focus();
}
document.addEventListener("keydown", (e) => {
  const open = document.querySelectorAll(".modal.open");
  if (!open.length) return;
  if (e.key === "Escape") { closeSheet(open[open.length - 1].id); return; }
  if (e.key !== "Tab") return;
  // Fallback for the `inert` page: always step through the topmost sheet's focusables ourselves,
  // because WebKit's own Tab skips buttons.
  const m = open[open.length - 1], f = focusables(m);
  e.preventDefault();
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  const next = i < 0 ? (e.shiftKey ? f.length - 1 : 0) : (i + (e.shiftKey ? -1 : 1) + f.length) % f.length;
  f[next].focus();
});
document.addEventListener("mousedown", (e) => { if (e.target.classList && e.target.classList.contains("modal")) closeSheet(e.target.id); });

let pairTarget = null;
function openPair(kind, value, who) {
  pairTarget = { kind, value };
  $("pairWho").textContent = who || value;
  $("pin").value = "";
  openSheet("pairModal");
}
$("pairModal").addEventListener("sheetclose", () => { pairTarget = null; });
function closePair() { closeSheet("pairModal"); }
function submitPair() {
  const pin = $("pin").value.replace(/\D/g, "");
  if (pin.length !== 6 || !pairTarget) { $("pin").focus(); return; }
  send({ action: "pair", target: pairTarget, pin });
  closePair();
}
$("pairGo").onclick = submitPair;
$("pairCancel").onclick = closePair;
$("pairClose").onclick = closePair;
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") submitPair(); });
$("pin").addEventListener("input", () => { $("pin").value = $("pin").value.replace(/\D/g, "").slice(0, 6); if ($("pin").value.length === 6) submitPair(); });

$("updBtn").onclick = () => openSheet("updateModal", "updBtn");
$("updClose").onclick = () => closeSheet("updateModal");
$("autoUpdate").onchange = (e) => send({ action: "set_auto_update", value: e.target.checked });
$("donateBtn").onclick = () => { openSheet("donateModal", "donateBtn"); send({ action: "donate_open", lang: LANG }); };
$("donateClose").onclick = () => closeSheet("donateModal");

$("addrGo").onclick = () => { const v = $("addr").value.trim(); if (v) send({ action: "connect", target: { kind: "addr", value: v } }); };
$("addr").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addrGo").click(); });
$("wpGo").onclick = () => { const a = $("wpAddr").value.trim(), c = $("wpCode").value.trim(); if (a && c) send({ action: "adb_pair", addr: a, code: c }); };
$("wcGo").onclick = () => { const a = $("wcAddr").value.trim(); if (a) send({ action: "adb_connect", addr: a }); };

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act) {
    case "connect": send({ action: "connect", target: { kind: d.kind, value: d.value } }); break;
    case "disconnect": send({ action: "disconnect" }); break;
    case "pair": openPair(d.kind, d.value, d.who); break;
    case "forget": send({ action: "forget", agent_id: d.id }); break;
    case "grant": send({ action: "grant", id: Number(d.id) }); break;
    case "install": send({ action: "install", serial: d.serial }); break;
    case "adbwifi": send({ action: "adb_wifi", serial: d.serial }); break;
    case "adbwifioff": send({ action: "adb_wifi_off", key: d.key }); break;
    case "serialstart": {
      const id = Number(d.id), f = sf(id);
      const baud = Number(String(f.baud).replace(/\s/g, ""));
      const tcp = String(f.tcp).trim();
      const port = tcp === "" ? null : Number(tcp);
      if (!Number.isInteger(baud) || baud <= 0) return window.onToast("err", t("badBaud"));
      if (port !== null && (!Number.isInteger(port) || port < 1 || port > 65535)) return window.onToast("err", t("badPort"));
      const pty = !!M.pty_supported && f.pty;
      if (!pty && port === null) return window.onToast("err", t("pickFront"));
      send({ action: "serial_start", id, baud, pty, tcp_port: port, rfc2217: port !== null && f.rfc });
      break;
    }
    case "serialstop": send({ action: "serial_stop", id: Number(d.id) }); break;
    case "updcheck": send({ action: "update_check" }); break;
    case "updinstall": send({ action: "update_install" }); break;
    case "updskip": send({ action: "update_skip" }); closeSheet("updateModal"); break;
    case "updlater": closeSheet("updateModal"); break;
    case "updpage": send({ action: "update_page" }); break;
    case "openurl": send({ action: "open_url", url: d.value }); break;
    case "copy": navigator.clipboard && navigator.clipboard.writeText(d.text).then(() => window.onToast("ok", d.text), () => {}); break;
    case "toggle": { const id = Number(d.id); expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderDevices(); break; }
  }
});
// Draw what was held back while a field had focus.
document.addEventListener("focusout", () => setTimeout(() => { if (M) renderDevices(); }, 0));
document.addEventListener("input", (e) => {
  const el = e.target.closest && e.target.closest("[data-sf]");
  if (!el) return;
  sf(Number(el.dataset.id))[el.dataset.sf] = el.type === "checkbox" ? el.checked : el.value;
});
$("top").addEventListener("mousedown", (e) => { if (e.button === 0 && !e.target.closest("button,input,.pill,.top-actions")) send({ action: "drag" }); });

send({ action: "ready" });
</script>
</body>
</html>
