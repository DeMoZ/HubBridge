[package]
name = "hubbridge-host"
description = "HubBridge desktop host (macOS, Windows, Linux): discovery, pairing, ADB forwarding, device list, RTT; library + `hubbridge` CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "hubbridge"
path = "src/main.rs"

[dependencies]
hubbridge-proto = { workspace = true }
hubbridge-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["process", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mdns-sd = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
gethostname = "1"

[dev-dependencies]
hubbridge-agent = { workspace = true }
